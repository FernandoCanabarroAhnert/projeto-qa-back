spring:
  profiles:
    active: default
  datasource:
    url: jdbc:postgresql://localhost:5433/projeto_qa?autoreconnect=true
    username: postgres
    password: 1234567
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      platform: postgres
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQL14Dialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db.migration